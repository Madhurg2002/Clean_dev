name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.1.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python_arch: x64
            artifact_name: DevCleaner
            asset_name: DevCleaner-linux-amd64
          - os: windows-latest
            python_arch: x64
            artifact_name: DevCleaner.exe
            asset_name: DevCleaner-windows-amd64.exe
          - os: windows-latest
            python_arch: x86
            artifact_name: DevCleaner.exe
            asset_name: DevCleaner-windows-386.exe
          - os: macos-latest
            artifact_name: DevCleaner
            asset_name: DevCleaner-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v4
        if: matrix.os != 'macos-latest'
        with:
          install-only: true

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --console --name "DevCleaner" --noconfirm --exclude-module tkinter --exclude-module sqlite3 --exclude-module unittest main.py

      - name: Rename and Prepare Asset
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Force Update Tag (on manual dispatch)
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'ubuntu-latest'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ github.event.inputs.tag_name }}
          git push origin -f ${{ github.event.inputs.tag_name }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: DevCleaner ${{ github.event.inputs.tag_name || github.ref_name }}
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
